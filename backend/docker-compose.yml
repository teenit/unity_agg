services:
  php:
    build: .
    container_name: egg_php
    ports:
      - "8014:80"
    volumes:
      - ./:/var/www/html
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: egg_mysql
    restart: unless-stopped
    ports:
      - "8015:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: egg_phpmyadmin
    restart: unless-stopped
    ports:
      - "8016:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
